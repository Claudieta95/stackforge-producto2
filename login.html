<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackForge - Iniciar sesión</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">StackForge</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavegacion"
                aria-controls="menuNavegacion"
                aria-expanded="false"
                aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNavegacion">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="usuarios.html">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="intercambios.html">Intercambios</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="login.html" id="enlace-login">Iniciar sesión</a>
                </li>
                <li class="nav-item">
                    <button type="button" class="nav-link" id="cerrar-sesion" hidden>
                        Cerrar sesión
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Formulario de inicio de sesión -->
<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">

            <section class="contenedor-login">
                <h1 class="text-center mb-4">INICIAR SESIÓN</h1>

                <form id="formulario-login">
                    <div class="mb-4">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               placeholder="Introduce tu correo electrónico"
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password"
                               class="form-control"
                               id="password"
                               placeholder="Introduce tu contraseña"
                               required>
                    </div>

                    <button type="submit" class="boton-login w-100">
                        Iniciar sesión
                    </button>

                    <p id="mensaje-login" class="mt-3" aria-live="polite"></p>
                </form>
            </section>

        </div>
    </div>
</main>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript del Login -->
<script type="module" src="js/login.js"></script>

</body>
</html>
