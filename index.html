<!DOCTYPE html>
<html lang="es">
<head>

    <title>StackForge - Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">StackForge</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavegacion"
                aria-controls="menuNavegacion"
                aria-expanded="false"
                aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNavegacion">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="usuarios.html">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="intercambios.html">Intercambios</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="login.html" id="enlace-login">Iniciar sesión</a>
                </li>
                <li class="nav-item">
                    <button type="button" class="nav-link" id="cerrar-sesion" hidden>
                        Cerrar sesión
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Contenido del Dashboard -->
<main class="container mt-5">
    <h1>Intercambio de idiomas</h1>

    <p>Encuentra personas con las que practicar y mejorar tus idiomas</p>

    <section class="mt-5">
        <h2>Intercambios disponibles</h2>

        <div id="lista-intercambios" class="row g-4 mt-2">
            <!-- Las tarjetas se generarán con JavaScript -->
        </div>
    </section>
</main>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript del Dashboard -->
<script type="module" src="js/dashboard.js"></script>
