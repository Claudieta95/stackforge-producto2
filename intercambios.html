<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackForge - Gestión de Intercambios</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Barra de navegación común -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">StackForge</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavegacion"
                aria-controls="menuNavegacion"
                aria-expanded="false"
                aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNavegacion">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="usuarios.html">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="intercambios.html">Intercambios</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="login.html" id="enlace-login">Iniciar sesión</a>
                </li>
                <li class="nav-item">
                    <button type="button" class="nav-link" id="cerrar-sesion" hidden>
                        Cerrar sesión
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Contenido de Gestión de Intercambios -->
<main class="container mt-5">
    <h1 class="text-center text-uppercase fw-bold mb-5">Gestión de Intercambios de Idiomas</h1>

    <div class="row g-5">
        
        <!-- COLUMNA IZQUIERDA: Formulario de Alta (Responsive: col-12 col-lg-5) -->
        <section class="col-12 col-lg-5">
            <div class="contenedor-login shadow-sm rounded p-4 bg-white">
                <h2 class="fs-4 fw-bold mb-4">Alta de intercambios</h2>
                
                <form id="mi-formulario">
                    <div class="mb-3">
                        <label for="input-titulo" class="form-label">Título</label>
                        <input type="text" id="input-titulo" class="form-control" placeholder="Ej. Intercambio inglés/español" required>
                    </div>

                    <div class="mb-3">
                        <label for="input-fecha" class="form-label">Fecha</label>
                        <input type="date" id="input-fecha" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="input-modalidad" class="form-label">Modalidad</label>
                        <input type="text" id="input-modalidad" class="form-control" placeholder="Ej. Presencial u Online" required>
                    </div>

                    <div class="mb-3">
                        <label for="textarea-descripcion" class="form-label">Descripción</label>
                        <textarea id="textarea-descripcion" class="form-control" rows="3" placeholder="Ofrezco practicar..." required></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="select-tipo" class="form-label">Tipo</label>
                        <select id="select-tipo" class="form-select" required>
                            <option value="oferta">Oferta</option>
                            <option value="peticion">Petición</option>
                        </select>
                    </div>

                    <button type="submit" class="boton-alta w-100 py-2">Dar de alta</button>
                </form>
            </div>
        </section>

        <!-- COLUMNA DERECHA: Consulta y Borrado Dinámico (Responsive: col-12 col-lg-7) -->
        <section class="col-12 col-lg-7">
            <h2 class="fs-4 fw-bold mb-4">Consulta y borrado de intercambios</h2>
            
            <!-- Contenedor responsive con las clases nativas row y g-4 de tu aplicación -->
            <div id="lista-intercambios" class="row g-4">
                <!-- Las tarjetas dinámicas se inyectarán aquí mediante js/intercambios.js -->
            </div>
        </section>

    </div>
</main>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script específico JavaScript para la gestión de intercambios (Persona 3) -->
<script type="module" src="js/intercambios.js"></script>

</body>
</html>
