<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackForge - Gestión de Intercambios</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Barra de navegación común -->
<nav class="navbar navbar-expand-lg border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">StackForge</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuNavegacion"
                aria-controls="menuNavegacion"
                aria-expanded="false"
                aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNavegacion">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="usuarios.html">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active fw-bold" href="intercambios.html">Intercambios</a>
                </li>
            </ul>

            <span class="navbar-text fw-semibold text-secondary">
                Usuario activo: <span id="usuarioActivo" class="text-dark">-no login-</span>
            </span>
        </div>
    </div>
</nav>

<!-- Contenido de Gestión de Intercambios -->
<main class="container mt-5">
    <h1 class="text-center text-uppercase fw-bold mb-5">Gestión de Intercambios de Idiomas</h1>

    <div class="row g-5">
        
        <!-- COLUMNA IZQUIERDA: Formulario de Alta e Indicador Gráfico Canvas -->
        <section class="col-12 col-lg-5">
            <div class="contenedor-login shadow-sm rounded p-4 bg-white">
                <h2 class="fs-4 fw-bold mb-4">Alta de intercambios</h2>
                
                <form id="form-intercambio">
                    <div class="mb-3">
                        <label for="input-titulo" class="form-label fw-semibold">Título</label>
                        <input type="text" id="input-titulo" class="form-control" placeholder="Ej. Intercambio inglés/español" required>
                    </div>

                    <div class="mb-3">
                        <label for="input-email" class="form-label fw-semibold">Correo electrónico</label>
                        <input type="email" id="input-email" class="form-control" placeholder="nombre@correo.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="input-fecha" class="form-label fw-semibold">Fecha</label>
                        <input type="date" id="input-fecha" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="textarea-descripcion" class="form-label fw-semibold">Descripción</label>
                        <textarea id="textarea-descripcion" class="form-control" rows="3" placeholder="Ofrezco practicar..." required></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="select-tipo" class="form-label fw-semibold">Tipo</label>
                        <select id="select-tipo" class="form-select" required>
                            <option value="Ofrezco idioma">Ofrezco idioma</option>
                            <option value="Busco idioma">Busco idioma</option>
                        </select>
                    </div>

                    <button type="submit" class="boton-alta w-100 py-2">Dar de alta</button>
                </form>
            </div>

            <!-- Canvas Nativo para Estadísticas Requeridas -->
            <div class="shadow-sm rounded p-3 bg-white mt-4 text-center">
                <h3 class="fs-6 fw-bold mb-3 text-secondary text-uppercase">Mapeado de Intercambios</h3>
                <canvas id="grafico-intercambios" width="240" height="160" class="mx-auto"></canvas>
            </div>
        </section>

        <!-- COLUMNA DERECHA: Tabla de Consulta y Borrado Síncrono (IndexedDB) -->
        <section class="col-12 col-lg-7">
            <div class="shadow-sm rounded p-4 bg-white h-100">
                <h2 class="fs-4 fw-bold mb-4">Consulta y borrado de intercambios</h2>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Título</th>
                                <th>Email</th>
                                <th>Fecha</th>
                                <th>Descripción</th>
                                <th>Tipo</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-intercambios-cuerpo">
                            <!-- Inyección dinámica mediante JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>
</main>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script de Gestión de Intercambios (Persona 3) -->
<script type="module" src="js/intercambios.js"></script>

</body>
</html>
